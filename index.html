<!doctype html>
<html lang="en" style="background-color: #000000; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Signo — MQTT Studio & Kfkax</title>
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!-- Instant Inline Apple Dark Mode Style to eliminate white flashes -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000000 !important;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000000;
      }

      /* Apple Welcome & Boot Screen Overlay */
      #apple-boot-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000000;
        user-select: none;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                    filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform, filter;
      }

      #apple-boot-screen.boot-exit {
        opacity: 0 !important;
        transform: scale(1.03) !important;
        filter: blur(12px) !important;
        pointer-events: none !important;
      }

      /* Ambient Apple Backlight Glow */
      .apple-ambient-glow {
        position: absolute;
        width: 580px;
        height: 360px;
        border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(99, 102, 241, 0.22) 0%, rgba(56, 189, 248, 0.08) 45%, transparent 70%);
        filter: blur(70px);
        pointer-events: none;
        animation: appleAmbientBreathe 5s ease-in-out infinite alternate;
      }

      @keyframes appleAmbientBreathe {
        0% { transform: scale(0.92); opacity: 0.65; }
        100% { transform: scale(1.08); opacity: 1; }
      }

      .apple-boot-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
        max-width: 90vw;
      }

      /* Signo Emblem in Apple Glass Style */
      .apple-emblem-wrap {
        position: relative;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .apple-emblem-glow {
        position: absolute;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
        filter: blur(14px);
        animation: pulseRing 3s ease-in-out infinite;
      }

      @keyframes pulseRing {
        0%, 100% { transform: scale(0.9); opacity: 0.5; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }

      .apple-signo-glyph {
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      /* Apple Animated Cursive "hello" SVG */
      .apple-hello-svg {
        width: 290px;
        height: 96px;
        overflow: visible;
        margin-bottom: 4px;
        filter: drop-shadow(0 2px 14px rgba(129, 140, 248, 0.45));
      }

      .apple-hello-stroke {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: drawHelloStroke 2.2s cubic-bezier(0.35, 0, 0.2, 1) forwards;
      }

      @keyframes drawHelloStroke {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* Multilingual Apple Typography Greeting */
      .apple-lang-carousel {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.35s ease, transform 0.35s ease, filter 0.35s ease;
        margin-top: 4px;
      }

      .apple-lang-carousel.fade-switch {
        opacity: 0;
        transform: translateY(4px);
        filter: blur(4px);
      }

      /* Apple Minimal Hardware Setup Progress Pill */
      .apple-progress-capsule {
        width: 240px;
        height: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        margin-top: 32px;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.7);
      }

      .apple-progress-bar {
        width: 8%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #ffffff, #c7d2fe);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
        transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
      }

      .apple-progress-shimmer {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.8) 50%, transparent 100%);
        transform: translateX(-100%);
        animation: progressShimmer 1.8s infinite;
      }

      @keyframes progressShimmer {
        100% {
          transform: translateX(100%);
        }
      }

      /* Apple Subtext / Status */
      .apple-status-text {
        margin-top: 14px;
        font-size: 12px;
        font-weight: 400;
        color: #86868b;
        letter-spacing: -0.01em;
        transition: opacity 0.25s ease;
      }

      /* Instant Enter / Bypass Button if network slows */
      .apple-skip-button {
        margin-top: 24px;
        padding: 6px 16px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #a1a1a6;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease, background 0.2s ease, color 0.2s ease;
      }

      .apple-skip-button.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .apple-skip-button:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load to ensure instant render -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c1017'/%3E%3Cpath d='M6 16c4-8 16-8 20 0' stroke='%236366f1' stroke-width='2' fill='none'/%3E%3Cpath d='M10 16c2.5-4 9.5-4 12 0' stroke='%23a855f7' stroke-width='2' fill='none'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%234c8dff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- React Root Container -->
    <div id="root"></div>

    <!-- Apple-Style Welcome & Instant Bootloader Overlay -->
    <div id="apple-boot-screen" role="progressbar" aria-label="Loading Signo Platform">
      <div class="apple-ambient-glow"></div>
      <div class="apple-boot-content">
        <!-- Signo Emblem in Apple Style -->
        <div class="apple-emblem-wrap">
          <div class="apple-emblem-glow"></div>
          <div class="apple-signo-glyph">
            <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 16c4.5-9 17.5-9 22 0" stroke="url(#glyphGrad1)" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M9.5 16c3-5 10-5 13 0" stroke="url(#glyphGrad2)" stroke-width="2.6" stroke-linecap="round"/>
              <circle cx="16" cy="16" r="2.8" fill="#ffffff"/>
              <defs>
                <linearGradient id="glyphGrad1" x1="5" y1="11" x2="27" y2="16" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#818cf8"/>
                  <stop offset="1" stop-color="#38bdf8"/>
                </linearGradient>
                <linearGradient id="glyphGrad2" x1="9" y1="13" x2="23" y2="16" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#c084fc"/>
                  <stop offset="1" stop-color="#818cf8"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>

        <!-- Apple Signature Cursive "hello" Vector Animation -->
        <svg class="apple-hello-svg" viewBox="0 0 360 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            class="apple-hello-stroke"
            d="M 36 94 C 33 94 28 90 30 81 C 32 64 54 28 69 28 C 76 28 79 33 76 43 L 59 98 C 57 103 60 105 64 102 C 73 94 84 66 94 54 C 101 46 108 48 106 56 C 101 70 91 95 95 98 C 98 100 104 93 111 82 M 116 80 C 124 67 136 59 146 59 C 154 59 157 64 152 75 L 121 83 C 120 92 125 98 136 98 C 144 98 155 90 163 79 M 125 75 C 136 73 145 69 144 64 C 143 61 137 61 130 65 M 165 98 C 172 98 179 89 185 71 L 202 28 C 204 20 200 17 193 22 C 184 27 172 48 168 63 L 166 95 C 169 98 177 98 185 91 M 198 98 C 205 98 212 89 218 71 L 235 28 C 237 20 233 17 226 22 C 217 27 205 48 201 63 L 199 95 C 202 98 210 98 218 91 M 248 59 C 233 59 222 74 222 87 C 222 95 229 101 240 101 C 257 101 268 85 268 72 C 268 63 259 59 248 59 Z M 245 68 C 253 68 257 74 255 82 C 253 89 245 93 239 92 C 234 90 234 83 237 75 C 240 70 243 68 245 68 Z M 264 69 C 273 63 287 63 298 69"
            stroke="url(#appleHelloGrad)"
            stroke-width="3.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <defs>
            <linearGradient id="appleHelloGrad" x1="30" y1="20" x2="300" y2="100" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ffffff"/>
              <stop offset="0.6" stop-color="#e0e7ff"/>
              <stop offset="1" stop-color="#93c5fd"/>
            </linearGradient>
          </defs>
        </svg>

        <!-- Cycling Multilingual Greetings in Apple Typography -->
        <div id="apple-lang-text" class="apple-lang-carousel">hello</div>

        <!-- Apple Minimal Hardware Setup Progress Pill -->
        <div class="apple-progress-capsule">
          <div id="apple-progress-bar" class="apple-progress-bar">
            <div class="apple-progress-shimmer"></div>
          </div>
        </div>

        <!-- Apple Status Subtext -->
        <div id="apple-status-text" class="apple-status-text">Preparing Signo Studio...</div>

        <!-- Instant Skip Failsafe Button (Reveals if network delays) -->
        <button id="apple-skip-btn" class="apple-skip-button" onclick="window.dismissSignoBoot && window.dismissSignoBoot()">
          Enter Workspace →
        </button>
      </div>
    </div>

    <!-- Apple Bootloader Controller Script -->
    <script>
      (function() {
        const startTime = Date.now();
        const MIN_DISPLAY_TIME_MS = 2600; // Guaranteed at least 2.6 - 3.0 seconds display

        const greetings = [
          'hello',
          'bonjour',
          'hola',
          'ciao',
          'hallo',
          'namaste',
          'konnichiwa',
          'signo'
        ];
        let greetIdx = 0;
        const langEl = document.getElementById('apple-lang-text');
        const barEl = document.getElementById('apple-progress-bar');
        const statusEl = document.getElementById('apple-status-text');
        const skipBtn = document.getElementById('apple-skip-btn');
        const screenEl = document.getElementById('apple-boot-screen');

        let isDismissed = false;
        let reactReady = false;

        // Multilingual rotation (cycles smoothly every 1100ms)
        const greetTimer = setInterval(function() {
          if (isDismissed || !langEl) return;
          langEl.classList.add('fade-switch');
          setTimeout(function() {
            greetIdx = (greetIdx + 1) % greetings.length;
            langEl.textContent = greetings[greetIdx];
            langEl.classList.remove('fade-switch');
          }, 220);
        }, 1100);

        // Natural progress animation curve timed across the 2.6s-3s window
        let progress = 14;
        if (barEl) barEl.style.width = progress + '%';

        setTimeout(function() {
          if (!isDismissed && barEl) {
            progress = 38;
            barEl.style.width = progress + '%';
            if (statusEl) statusEl.textContent = 'Initializing telemetry bridges...';
          }
        }, 500);

        setTimeout(function() {
          if (!isDismissed && barEl) {
            progress = 65;
            barEl.style.width = progress + '%';
            if (statusEl) statusEl.textContent = 'Configuring event engines...';
          }
        }, 1200);

        setTimeout(function() {
          if (!isDismissed && barEl) {
            progress = 88;
            barEl.style.width = progress + '%';
            if (statusEl) statusEl.textContent = 'Preparing streaming workspace...';
          }
        }, 1900);

        setTimeout(function() {
          if (!isDismissed && barEl && !reactReady) {
            progress = 95;
            barEl.style.width = progress + '%';
            if (statusEl) statusEl.textContent = 'Finalizing runtime...';
          }
        }, 2400);

        // Reveal skip button at 4.5s only if network is genuinely slow
        setTimeout(function() {
          if (!isDismissed && skipBtn) {
            skipBtn.classList.add('visible');
          }
        }, 4500);

        function finishAndExit() {
          if (isDismissed) return;
          isDismissed = true;
          clearInterval(greetTimer);

          if (barEl) {
            barEl.style.transition = 'width 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
            barEl.style.width = '100%';
          }
          if (statusEl) {
            statusEl.textContent = 'Ready';
          }

          setTimeout(function() {
            if (screenEl) {
              screenEl.classList.add('boot-exit');
              setTimeout(function() {
                if (screenEl.parentNode) {
                  screenEl.parentNode.removeChild(screenEl);
                }
              }, 500);
            }
          }, 280);
        }

        // Global dismiss handler called when React mounts or when user clicks Enter
        window.dismissSignoBoot = function(forceImmediate) {
          reactReady = true;
          if (isDismissed) return;

          const elapsed = Date.now() - startTime;
          const remaining = forceImmediate ? 0 : Math.max(0, MIN_DISPLAY_TIME_MS - elapsed);

          if (remaining > 0) {
            setTimeout(finishAndExit, remaining);
          } else {
            finishAndExit();
          }
        };

        // Safety fallback: Never keep user stuck for more than 6 seconds
        setTimeout(function() {
          if (!isDismissed) {
            finishAndExit();
          }
        }, 6000);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
